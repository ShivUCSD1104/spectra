[project]
name = "spectra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShivUCSD1104", email = "shm010@ucsd.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "tensorly>=0.9.0",
    "typer>=0.26.7",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
torch = ["torch"]
wavelet = ["PyWavelets"]

[project.scripts]
spectra = "spectra.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
