[project]
name = "stz"
version = "0.1.2"
description = "Command-line tool for analyzing, transforming, and compressing tensor artifacts (.npy, .npz). Profiles sparsity, entropy, and spectral structure per tensor, then routes each to optimal compression (fp16, int8, sparse COO, SVD)."
readme = "README.md"
authors = [
    { name = "ShivUCSD1104", email = "shm010@ucsd.edu" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "rich>=10.0.0",
    "scipy>=1.7.0",
    "tensorly>=0.6.0",
    "typer>=0.9.0",
    "zstandard>=0.18.0",
]

[project.optional-dependencies]
torch = ["torch"]
wavelet = ["PyWavelets"]

[project.scripts]
spectra = "spectra.__main__:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spectra"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
